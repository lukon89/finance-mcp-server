[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-mcp-server"
version = "0.1.0"
description = "Finance MCP Server with OAuth 2.0, SQLite, and SSE transport"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # needed by respx
]

[project.scripts]
finance-mcp = "finance_mcp.server:main"
finance-mcp-http = "finance_mcp.http_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
